<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance AI Report Generator</title>
<style>
  body {
    font-family: -apple-system, Arial, sans-serif;
    max-width: 600px;
    margin: 40px auto;
    padding: 20px;
    background: #f5f5f7;
  }
  h1 {
    font-size: 22px;
  }
  label {
    display: block;
    margin-top: 14px;
    font-weight: 600;
    font-size: 14px;
  }
  input {
    width: 100%;
    padding: 10px;
    margin-top: 4px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
    box-sizing: border-box;
  }
  button {
    margin-top: 20px;
    width: 100%;
    padding: 12px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
  }
  button:disabled {
    background: #999;
  }
  #result {
    margin-top: 24px;
    padding: 16px;
    background: white;
    border-radius: 8px;
    white-space: pre-wrap;
    font-size: 14px;
    display: none;
  }
</style>
</head>
<body>

<h1>Finance AI Report Generator</h1>

<label>Company Name</label>
<input id="company" placeholder="e.g. TechCorp Sweden AB">

<label>Period</label>
<input id="period" placeholder="e.g. August 2026">

<label>Revenue (SEK)</label>
<input id="revenue" type="number" placeholder="e.g. 210000">

<label>Cost of Goods Sold (SEK)</label>
<input id="cogs" type="number" placeholder="e.g. 85000">

<label>Operating Expenses (SEK)</label>
<input id="expenses" type="number" placeholder="e.g. 52000">

<button id="generateBtn" onclick="generateReport()">Generate Report</button>

<div id="result"></div>

<script>
async function generateReport() {
  const btn = document.getElementById('generateBtn');
  const resultDiv = document.getElementById('result');

  const data = {
    company: document.getElementById('company').value,
    period: document.getElementById('period').value,
    revenue: document.getElementById('revenue').value,
    cogs: document.getElementById('cogs').value,
    operating_expenses: document.getElementById('expenses').value
  };

  btn.disabled = true;
  btn.textContent = "Generating...";
  resultDiv.style.display = "none";

  try {
    const response = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });

    const result = await response.json();

    resultDiv.style.display = "block";
    resultDiv.textContent =
      "Company: " + result.company + "\n" +
      "Period: " + result.period + "\n" +
      "Revenue: " + result.revenue + " SEK\n" +
      "COGS: " + result.cogs + " SEK\n" +
      "Operating Expenses: " + result.operating_expenses + " SEK\n" +
      "Net Profit: " + result.net_profit + " SEK\n\n" +
      "Summary:\n" + result.summary;

  } catch (err) {
    resultDiv.style.display = "block";
    resultDiv.textContent = "Error generating report. Please check your inputs and try again.";
  }

  btn.disabled = false;
  btn.textContent = "Generate Report";
}
</script>

</body>
</html>
