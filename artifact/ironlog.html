<script>
// ===================== db.js =====================
const DB_NAME = 'ironlog';
const DB_VERSION = 1;
const STORES = ['settings', 'program', 'workouts', 'recovery', 'photos', 'achievements'];
let dbPromise = null;

function openDb() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', { keyPath: 'key' });
      if (!db.objectStoreNames.contains('program')) db.createObjectStore('program', { keyPath: 'key' });
      if (!db.objectStoreNames.contains('workouts')) {
        const s = db.createObjectStore('workouts', { keyPath: 'id' });
        s.createIndex('date', 'date');
      }
      if (!db.objectStoreNames.contains('recovery')) {
        const s = db.createObjectStore('recovery', { keyPath: 'date' });
        s.createIndex('date', 'date');
      }
      if (!db.objectStoreNames.contains('photos')) db.createObjectStore('photos', { keyPath: 'exerciseId' });
      if (!db.objectStoreNames.contains('achievements')) db.createObjectStore('achievements', { keyPath: 'id' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}

async function tx(storeName, mode) {
  const db = await openDb();
  return db.transaction(storeName, mode).objectStore(storeName);
}

const DB = {
  async get(store, key) {
    const s = await tx(store, 'readonly');
    return new Promise((resolve, reject) => {
      const r = s.get(key);
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    });
  },
  async getAll(store) {
    const s = await tx(store, 'readonly');
    return new Promise((resolve, reject) => {
      const r = s.getAll();
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    });
  },
  async put(store, value) {
    const s = await tx(store, 'readwrite');
    return new Promise((resolve, reject) => {
      const r = s.put(value);
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    });
  },
  async delete(store, key) {
    const s = await tx(store, 'readwrite');
    return new Promise((resolve, reject) => {
      const r = s.delete(key);
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    });
  },
  async clear(store) {
    const s = await tx(store, 'readwrite');
    return new Promise((resolve, reject) => {
      const r = s.clear();
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    });
  },
  async exportAll() {
    const dump = {};
    for (const store of STORES) dump[store] = await DB.getAll(store);
    dump._meta = { app: 'IronLog', exportedAt: new Date().toISOString(), version: DB_VERSION };
    return dump;
  },
  async importAll(dump) {
    for (const store of STORES) {
      if (!dump[store]) continue;
      await DB.clear(store);
      const s = await tx(store, 'readwrite');
      for (const item of dump[store]) s.put(item);
    }
  },
};

// ===================== defaults.js =====================
const WEEK_PERCENTS = [
  { week: 1, percent: 75, isDeload: false },

    region: opts.region || 'upper',
    isMainLift: !!opts.isMainLift,
    percentSource: opts.percentSource || null,
    percentMode: opts.percentMode || null,
    fixedPercent: opts.fixedPercent ?? null,
    weightIncrement: opts.weightIncrement ?? null,
    notes: opts.notes || '',
  };
}

function defaultSettings() {
  return {
    key: 'settings',
    oneRM: { bench: 100, squat: 120, deadlift: 140 },
    weightIncrements: { upper: 2.5, lower: 5 },
    roundingIncrement: 2.5,

// ===================== calc.js =====================
function roundToIncrement(value, increment) {
  if (!increment) return Math.round(value * 100) / 100;
  return Math.round(value / increment) * increment;
}
function workingWeight(oneRM, percent, roundingIncrement) {
  const raw = (oneRM * percent) / 100;
  return roundToIncrement(raw, roundingIncrement);
}
function estimate1RM(weight, reps) {
  if (!weight || !reps) return 0;
  if (reps === 1) return weight;
  return weight * (1 + reps / 30);
}
function parseRepTarget(reps) {
  if (!reps) return { min: 0, max: 0 };
  const m = String(reps).match(/(\d+)\s*-\s*(\d+)/);
  if (m) return { min: parseInt(m[1], 10), max: parseInt(m[2], 10) };
  const n = parseInt(reps, 10);
  return { min: n || 0, max: n || 0 };
}
function totalVolume(sets) {
  return sets.reduce((sum, s) => sum + (s.weight || 0) * (s.actualReps || 0), 0);
}
function suggestIncrease(region, weightIncrements) {
  return region === 'lower' ? weightIncrements.lower : weightIncrements.upper;
}
function checkExceededTarget(targetReps, actualReps) {
  if (!targetReps || !actualReps) return null;
  const exceededBy = actualReps - targetReps;
  if (exceededBy >= 3) return { exceededBy };
  return null;
}
function toDateOnly(d) {
  const dt = new Date(d);
  return new Date(dt.getFullYear(), dt.getMonth(), dt.getDate());
}
function computeStreak(workoutDates) {
  if (!workoutDates.length) return 0;
  const uniqueDays = [...new Set(workoutDates.map((d) => toDateOnly(d).getTime()))].sort((a, b) => b - a);
  const today = toDateOnly(new Date()).getTime();
  const oneDay = 24 * 60 * 60 * 1000;
  let streak = 0;
  let cursor = today;
  if (uniqueDays[0] !== today) cursor = today - oneDay;
  for (const day of uniqueDays) {
    if (day === cursor) { streak++; cursor -= oneDay; }
    else if (day < cursor) break;
  }
  return streak;
}
function isoWeekKey(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  const weekNo = Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
  return `${d.getUTCFullYear()}-W${String(weekNo).padStart(2, '0')}`;
}
function monthKey(date) {
  const d = new Date(date);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}

];
function badgeById(id) { return BADGES.find((b) => b.id === id); }
const LIFT_THRESHOLDS = {
  bench: { weight: 100, badge: 'first_bench_100' },
  squat: { weight: 120, badge: 'first_squat_120' },
  deadlift: { weight: 140, badge: 'first_deadlift_140' },
};
const LIFT_PR_BADGE = { bench: 'new_bench_pr', squat: 'new_squat_pr', deadlift: 'new_deadlift_pr' };
function evaluateAchievements(ctx) {
  const unlocked = [];
  const has = (id) => ctx.alreadyUnlocked.has(id);
  const grant = (id) => { if (!has(id)) unlocked.push(id); };
  if (ctx.totalWorkouts >= 1) grant('first_workout');
  if (ctx.totalWorkouts >= 10) grant('workouts_10');
  if (ctx.totalWorkouts >= 50) grant('workouts_50');
  if (ctx.totalWorkouts >= 100) grant('workouts_100');
  if (ctx.streak >= 7) grant('streak_7');
  if (ctx.streak >= 30) grant('streak_30');
  for (const evt of ctx.liftPrEvents || []) {
    const threshold = LIFT_THRESHOLDS[evt.liftKey];
    if (threshold && evt.type === 'weight' && evt.value >= threshold.weight) grant(threshold.badge);
    if (evt.type === 'weight' && LIFT_PR_BADGE[evt.liftKey]) grant(LIFT_PR_BADGE[evt.liftKey]);
  }
  return unlocked.map(badgeById).filter(Boolean);
}

// ===================== charts.js =====================
function setupCanvas(canvas) {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  return { ctx, w: rect.width, h: rect.height };
}
function drawLineChart(canvas, points, opts = {}) {
  const { ctx, w, h } = setupCanvas(canvas);
  ctx.clearRect(0, 0, w, h);
  const pad = { l: 40, r: 12, t: 16, b: 24 };
  const plotW = w - pad.l - pad.r;
  const plotH = h - pad.t - pad.b;
  const color = opts.color || '#E8452F';
  ctx.strokeStyle = 'rgba(243,239,233,0.08)';
  ctx.fillStyle = 'rgba(243,239,233,0.45)';
  ctx.font = "10px 'IBM Plex Mono', monospace";
  ctx.lineWidth = 1;
  if (!points.length) { ctx.fillText('No data yet', pad.l, pad.t + plotH / 2); return; }
  const values = points.map((p) => p.value);
  let min = Math.min(...values);
  let max = Math.max(...values);
  if (min === max) { min -= 1; max += 1; }
  const range = max - min;
  const gridLines = 4;
  for (let i = 0; i <= gridLines; i++) {
    const y = pad.t + (plotH * i) / gridLines;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();
    const val = max - (range * i) / gridLines;
    ctx.fillText(Math.round(val * 10) / 10, 2, y + 3);
  }
  const stepX = points.length > 1 ? plotW / (points.length - 1) : 0;
  const xy = (i) => {
    const x = pad.l + stepX * i;
    const y = pad.t + plotH - ((points[i].value - min) / range) * plotH;
    return [x, y];
  };
  ctx.beginPath();
  points.forEach((p, i) => { const [x, y] = xy(i); if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
  const [lastX] = xy(points.length - 1);
  ctx.lineTo(lastX, pad.t + plotH); ctx.lineTo(pad.l, pad.t + plotH); ctx.closePath();
  const grad = ctx.createLinearGradient(0, pad.t, 0, pad.t + plotH);
  grad.addColorStop(0, color + '55'); grad.addColorStop(1, color + '00');
  ctx.fillStyle = grad; ctx.fill();
  ctx.beginPath();
  points.forEach((p, i) => { const [x, y] = xy(i); if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
  ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.stroke();
  points.forEach((p, i) => { const [x, y] = xy(i); ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill(); });
}
function drawBarChart(canvas, points, opts = {}) {
  const { ctx, w, h } = setupCanvas(canvas);
  ctx.clearRect(0, 0, w, h);
  const pad = { l: 40, r: 12, t: 16, b: 24 };
  const plotW = w - pad.l - pad.r;
  const plotH = h - pad.t - pad.b;
  const color = opts.color || '#E8452F';
  ctx.strokeStyle = 'rgba(243,239,233,0.08)';
  ctx.fillStyle = 'rgba(243,239,233,0.45)';
  ctx.font = "10px 'IBM Plex Mono', monospace";
  if (!points.length) { ctx.fillText('No data yet', pad.l, pad.t + plotH / 2); return; }
  const values = points.map((p) => p.value);
  const max = Math.max(...values, 1);
  const gridLines = 4;
  for (let i = 0; i <= gridLines; i++) {
    const y = pad.t + (plotH * i) / gridLines;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();
    const val = max - (max * i) / gridLines;
    ctx.fillText(Math.round(val), 2, y + 3);
  }
  const barW = (plotW / points.length) * 0.6;
  const gap = (plotW / points.length) * 0.4;
  points.forEach((p, i) => {
    const x = pad.l + i * (barW + gap) + gap / 2;
    const barH = (p.value / max) * plotH;
    const y = pad.t + plotH - barH;
    ctx.fillStyle = color; ctx.fillRect(x, y, barW, barH);
    ctx.fillStyle = 'rgba(243,239,233,0.5)'; ctx.fillText(p.label, x, h - 6);
  });
}

function computeTarget(exerciseDef) {
  if (!exerciseDef.percentSource) return { weight: null, percent: null };
  const oneRM = STATE.settings.oneRM[exerciseDef.percentSource];
  let percent = exerciseDef.percentMode === 'fixed' ? exerciseDef.fixedPercent : currentWeekInfo().percent;
  const weight = workingWeight(oneRM, percent, STATE.settings.roundingIncrement);
  return { weight, percent };
}

async function findPrevious(exerciseId, excludeWorkoutId) {
  const workouts = await DB.getAll('workouts');
  const sorted = workouts.filter((w) => w.completedAt && w.id !== excludeWorkoutId).sort((a, b) => new Date(b.completedAt) - new Date(a.completedAt));
  for (const w of sorted) {
    const inst = w.exercises && w.exercises.find((e) => e.exerciseId === exerciseId);
    if (inst) {
      const doneSets = inst.sets.filter((s) => s.done);
      if (doneSets.length) {
        const top = doneSets.reduce((a, b) => (b.weight > a.weight ? b : a));
        return { date: w.completedAt, weight: top.weight, reps: top.actualReps };
      }
    }
  }
  return null;
}

async function buildWorkout(dayIndex) {
  const day = STATE.program.days[dayIndex];
  const weekInfo = currentWeekInfo();
  const exercises = [];
  for (const block of day.blocks) {
    for (const def of block.exercises) {
      const { weight, percent } = computeTarget(def);
      const prev = await findPrevious(def.id, null);
      const sets = [];
      for (let i = 0; i < def.sets; i++) {
        const targetReps = def.repsScheme ? def.repsScheme[i] : parseRepTarget(def.reps).max;
        sets.push({ targetReps, weight: weight != null ? weight : (prev ? prev.weight : null), actualReps: null, done: false });
      }
      exercises.push({
        exerciseId: def.id, name: def.name, category: block.category, region: def.region,
        isMainLift: def.isMainLift, percentSource: def.percentSource, percentMode: def.percentMode,
        percent, targetWeight: weight, repsDisplay: def.reps, notes: def.notes || '',
        sessionNote: '', previous: prev, sets, suggestion: null,
      });
    }
  }
  return {
    id: uid(), dayId: day.id, dayName: day.name, dayIndex, weekNumber: STATE.settings.currentWeek || 1,
    isDeload: !!weekInfo.isDeload, startedAt: new Date().toISOString(), completedAt: null, durationSec: 0, exercises,
  };
}

function renderSetRow(s, si) {
  return `<div class="set-row">
    <div class="set-num">${si + 1}</div>
    <input type="number" step="0.5" placeholder="kg" data-field="weight" data-set="${si}" value="${s.weight ?? ''}">

    <button class="set-check ${s.done ? 'done' : ''}" data-set="${si}">${s.done ? '✓' : ''}</button>
  </div>`;
}

async function onToggleSet(exIdx, si, cardEl, inst) {
  const set = inst.sets[si];
  set.done = !set.done;
  if (set.done && (set.actualReps == null || set.weight == null)) {
    toast('⚠️', 'Missing data', 'Enter weight and reps before checking off a set.');
    set.done = false;
    return;
  }
  await persistDraft();
  if (set.done) {
    checkMiniPr(inst);
    const exceeded = checkExceededTarget(set.targetReps, set.actualReps);
    const isLastSet = si === inst.sets.length - 1;
    if (exceeded && isLastSet) {
      const inc = suggestIncrease(inst.region, STATE.settings.weightIncrements);
      inst.suggestion = `Great job! You exceeded the target by ${exceeded.exceededBy} rep${exceeded.exceededBy > 1 ? 's' : ''}. This weight may be too light. Consider +${inc} kg next time.`;
      await persistDraft();
    }
    openRestTimer();
  }
  render();
}

function checkMiniPr(inst) {
  const key = liftKeyFor(inst);
  const hist = STATE.settings.prHistory[key] || { maxWeight: 0, maxReps: 0, best1RM: 0, maxVolume: 0 };
  const doneSets = inst.sets.filter((s) => s.done);
  const vol = totalVolume(doneSets.map((s) => ({ weight: s.weight, actualReps: s.actualReps })));
  const lastSet = doneSets[doneSets.length - 1];
  const est1rm = estimate1RM(lastSet.weight, lastSet.actualReps);
  let hit = null;
  if (lastSet.weight > hist.maxWeight) hit = 'weight';
  else if (est1rm > hist.best1RM) hit = '1rm';
  else if (vol > hist.maxVolume) hit = 'volume';
  hist.maxWeight = Math.max(hist.maxWeight, lastSet.weight);
  hist.maxReps = Math.max(hist.maxReps, lastSet.actualReps);
  hist.best1RM = Math.max(hist.best1RM, est1rm);
  hist.maxVolume = Math.max(hist.maxVolume, vol);
  STATE.settings.prHistory[key] = hist;
  saveSettings();
  if (hit) {
    inst._prEventsThisSession = inst._prEventsThisSession || [];
    inst._prEventsThisSession.push({ liftKey: key, type: hit, value: lastSet.weight });
    toast('🔥', 'New PR!', `${inst.name}: new ${hit === '1rm' ? 'estimated 1RM' : hit} PR.`);
  }
}

function openRestTimer() {
  const seconds = STATE.settings.restSeconds || 300;
  let remaining = seconds;
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop center';
  backdrop.innerHTML = `
    <div class="modal-sheet card-modal">
      <div class="modal-title" style="text-align:center;">Rest Timer</div>
      <div class="timer-display" id="timer-display">${formatTime(remaining)}</div>
      <div class="row"><button class="btn secondary" id="timer-minus">−30s</button><button class="btn secondary" id="timer-plus">+30s</button></div>
      <button class="btn block" id="timer-skip" style="margin-top:10px;">Skip / Close</button>
    </div>`;
  document.body.appendChild(backdrop);
  const display = backdrop.querySelector('#timer-display');
  const interval = setInterval(() => {
    remaining--;
    if (remaining <= 0) {
      display.textContent = "Time's up!";
      clearInterval(interval);
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      setTimeout(() => backdrop.remove(), 1200);
      return;
    }
    display.textContent = formatTime(remaining);
  }, 1000);
  backdrop.querySelector('#timer-minus').addEventListener('click', () => { remaining = Math.max(0, remaining - 30); display.textContent = formatTime(remaining); });
  backdrop.querySelector('#timer-plus').addEventListener('click', () => { remaining += 30; display.textContent = formatTime(remaining); });
  backdrop.querySelector('#timer-skip').addEventListener('click', () => { clearInterval(interval); backdrop.remove(); });
}
function formatTime(sec) { const m = Math.floor(sec / 60); const s = sec % 60; return `${m}:${String(s).padStart(2, '0')}`; }

async function finishWorkout() {
  const w = STATE.draftWorkout;
  if (!w.exercises.some((e) => e.sets.some((s) => s.done))) { toast('⚠️', 'No sets logged', 'Log at least one set before finishing.'); return; }
  w.completedAt = new Date().toISOString();
  w.durationSec = Math.round((new Date(w.completedAt) - new Date(w.startedAt)) / 1000);
  let liftPrEvents = [];
  w.exercises.forEach((inst) => { if (inst._prEventsThisSession) liftPrEvents = liftPrEvents.concat(inst._prEventsThisSession); delete inst._prEventsThisSession; });
  await DB.put('workouts', w);
  const allWorkouts = await DB.getAll('workouts');
  const completed = allWorkouts.filter((x) => x.completedAt);
  const streak = computeStreak(completed.map((x) => x.completedAt));
  const alreadyUnlocked = new Set((await DB.getAll('achievements')).map((a) => a.id));
  const newBadges = evaluateAchievements({ totalWorkouts: completed.length, alreadyUnlocked, liftPrEvents, streak });
  for (const b of newBadges) await DB.put('achievements', { id: b.id, unlockedAt: new Date().toISOString() });
  STATE.settings.currentDayIndex = (STATE.settings.currentDayIndex + 1) % STATE.program.days.length;
  const justFinishedLastDay = STATE.settings.currentDayIndex === 0;
  await saveSettings();
  STATE.draftWorkout = null;
  STATE.celebrationQueue = newBadges.slice();
  render();
  runCelebrationQueue();
  if (justFinishedLastDay) setTimeout(() => promptWeekAdvance(), newBadges.length ? 400 * (newBadges.length + 1) : 300);
}

function promptWeekAdvance() {
  const wk = STATE.settings.currentWeek || 1;
  const info = currentWeekInfo();
  if (info.isDeload) { openStartNewBlockModal(); return; }
  const nextWeek = Math.min(8, wk + 1);
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop center';
  backdrop.innerHTML = `
    <div class="modal-sheet card-modal">

      <button class="btn block secondary" id="wk-no" style="margin-top:8px;">Stay on Week ${wk}</button>
    </div>`;

  backdrop.querySelector('#wk-yes').addEventListener('click', async () => { STATE.settings.currentWeek = nextWeek; await saveSettings(); backdrop.remove(); render(); });
  backdrop.querySelector('#wk-no').addEventListener('click', () => backdrop.remove());
}

function runCelebrationQueue() {

function spawnConfetti() {
  const colors = ['#E8452F', '#D9A63E', '#3FA66B', '#E08A3C', '#F3EFE9'];
  for (let i = 0; i < 60; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + 'vw';
    piece.style.background = colors[i % colors.length];
    piece.style.animationDuration = 1.6 + Math.random() * 1.4 + 's';
    piece.style.animationDelay = Math.random() * 0.3 + 's';
    piece.style.transform = `rotate(${Math.random() * 360}deg)`;
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 3200);
  }
}

    </div>
    <div class="card"><div class="card-title">Estimated 1RM — Bench</div><canvas class="chart" id="chart-bench"></canvas></div>
    <div class="card"><div class="card-title">Estimated 1RM — Squat</div><canvas class="chart" id="chart-squat"></canvas></div>
    <div class="card"><div class="card-title">Estimated 1RM — Deadlift</div><canvas class="chart" id="chart-deadlift"></canvas></div>
    <div class="card"><div class="card-title">Body Weight</div><canvas class="chart" id="chart-bw"></canvas></div>
    <div class="card"><div class="card-title">Weekly Training Volume</div><canvas class="chart" id="chart-weekvol"></canvas></div>
    <div class="card"><div class="card-title">Monthly Training Volume</div><canvas class="chart" id="chart-monthvol"></canvas></div>`;
  const oneRMSeries = (liftKey) => {
    const pts = [];
    workouts.forEach((w) => { w.exercises.filter((e) => e.percentSource === liftKey).forEach((inst) => { inst.sets.filter((s) => s.done).forEach((s) => { pts.push({ value: estimate1RM(s.weight, s.actualReps) }); }); }); });
    return pts.slice(-20);
  };
  drawLineChart(container.querySelector('#chart-bench'), oneRMSeries('bench'), { color: '#E8452F' });
  drawLineChart(container.querySelector('#chart-squat'), oneRMSeries('squat'), { color: '#D9A63E' });
  drawLineChart(container.querySelector('#chart-deadlift'), oneRMSeries('deadlift'), { color: '#3FA66B' });
  const bwPts = recovery.filter((r) => r.bodyweight).slice(-20).map((r) => ({ value: r.bodyweight }));
  drawLineChart(container.querySelector('#chart-bw'), bwPts, { color: '#3FA66B' });
  const weekMap = {};
  workouts.forEach((w) => { const key = isoWeekKey(new Date(w.completedAt)); const vol = w.exercises.reduce((sum, e) => sum + totalVolume(e.sets.filter((s) => s.done)), 0); weekMap[key] = (weekMap[key] || 0) + vol; });
  drawBarChart(container.querySelector('#chart-weekvol'), Object.entries(weekMap).slice(-8).map(([k, v]) => ({ label: k.split('-W')[1], value: v })), { color: '#E8452F' });
  const monthMap = {};
  workouts.forEach((w) => { const key = monthKey(w.completedAt); const vol = w.exercises.reduce((sum, e) => sum + totalVolume(e.sets.filter((s) => s.done)), 0); monthMap[key] = (monthMap[key] || 0) + vol; });
  drawBarChart(container.querySelector('#chart-monthvol'), Object.entries(monthMap).slice(-6).map(([k, v]) => ({ label: k.split('-')[1], value: v })), { color: '#D9A63E' });
}

async function renderRecovery(container) {
  const all = (await DB.getAll('recovery')).sort((a, b) => new Date(b.date) - new Date(a.date));
  const today = all.find((r) => r.date === todayISO()) || { date: todayISO() };
  const recent = all.slice(0, 5);
  const poorSignal = recent.length >= 3 && recent.slice(0, 3).every((r) => (r.energy && r.energy <= 2) || (r.sleep && r.sleep < 6) || (r.soreness && r.soreness >= 4));
  container.innerHTML = `
    ${poorSignal ? `<div class="warning-banner"><div>⚠️</div><div>Your recovery markers have been low for the last 3 entries. Consider reducing training volume or intensity this week.</div></div>` : ''}
    <div class="card">
      <div class="card-title">Today — ${today.date}</div>
      <div class="row"><div><label>Sleep (hrs)</label><input type="number" step="0.5" id="rc-sleep" value="${today.sleep ?? ''}"></div><div><label>Body weight (kg)</label><input type="number" step="0.1" id="rc-bw" value="${today.bodyweight ?? ''}"></div></div>
      <div class="row"><div><label>Energy (1-5)</label><input type="number" min="1" max="5" id="rc-energy" value="${today.energy ?? ''}"></div><div><label>Mood (1-5)</label><input type="number" min="1" max="5" id="rc-mood" value="${today.mood ?? ''}"></div><div><label>Soreness (1-5)</label><input type="number" min="1" max="5" id="rc-soreness" value="${today.soreness ?? ''}"></div></div>
      <div class="row"><div><label>Water (L)</label><input type="number" step="0.1" id="rc-water" value="${today.water ?? ''}"></div><div><label>Calories</label><input type="number" id="rc-cal" value="${today.calories ?? ''}"></div><div><label>Protein (g)</label><input type="number" id="rc-protein" value="${today.protein ?? ''}"></div></div>
      <button class="btn block" id="rc-save" style="margin-top:12px;">Save Today's Recovery</button>
    </div>
    <div class="card">
      <div class="card-title">Recent Entries</div>
      ${recent.length ? recent.map((r) => `<div class="prev-line" style="margin-bottom:6px;"><strong style="color:var(--chalk);">${r.date}</strong> — Sleep ${r.sleep ?? '–'}h, Energy ${r.energy ?? '–'}/5, Mood ${r.mood ?? '–'}/5, BW ${r.bodyweight ?? '–'}kg</div>`).join('') : '<div class="empty-state"><div class="ic">🌙</div>No recovery entries yet.</div>'}
    </div>`;
  container.querySelector('#rc-save').addEventListener('click', async () => {
    const entry = {
      date: today.date,
      sleep: parseFloat(container.querySelector('#rc-sleep').value) || null,
      bodyweight: parseFloat(container.querySelector('#rc-bw').value) || null,
      energy: parseInt(container.querySelector('#rc-energy').value, 10) || null,
      mood: parseInt(container.querySelector('#rc-mood').value, 10) || null,
      soreness: parseInt(container.querySelector('#rc-soreness').value, 10) || null,
      water: parseFloat(container.querySelector('#rc-water').value) || null,
      calories: parseFloat(container.querySelector('#rc-cal').value) || null,
      protein: parseFloat(container.querySelector('#rc-protein').value) || null,
    };
    await DB.put('recovery', entry);
    toast('✅', 'Saved', "Today's recovery logged.");
    render();
  });
}

function renderSettings(container) {
  const s = STATE.settings;
  container.innerHTML = `
    <div class="card">
      <div class="card-title">Rest Timer</div>
      <label>Default rest between sets (seconds)</label><input type="number" id="set-rest" value="${s.restSeconds}">
      <label>Alert style</label>
      <select id="set-alert"><option value="visual" ${s.timerAlertMode === 'visual' ? 'selected' : ''}>Visual only</option><option value="vibration" ${s.timerAlertMode === 'vibration' ? 'selected' : ''}>Vibration</option><option value="sound" ${s.timerAlertMode === 'sound' ? 'selected' : ''}>Sound + Vibration</option></select>
      <button class="btn block secondary" id="save-rest" style="margin-top:12px;">Save</button>
    </div>
    <div class="card">
      <div class="card-title">Backup</div>
      <div class="exercise-meta" style="margin-bottom:10px;">All data lives only on this device. Export a backup file regularly, especially before changing phones.</div>
      <button class="btn block secondary" id="export-btn">⬇ Export Backup</button>
      <label style="margin-top:10px;">Import backup file</label>
      <input type="file" id="import-file" accept="application/json">
    </div>
    <div class="card"><div class="card-title">Danger Zone</div><button class="btn block danger" id="reset-btn">Erase All Data</button></div>
    <div class="card"><div class="card-title">About</div><div class="exercise-meta">IronLog — personal powerlifting tracker. No ads, no accounts. Data is stored in this browser only (per-device, per-app); export a backup before switching phones or browsers.</div></div>`;
  container.querySelector('#save-rest').addEventListener('click', async () => {
    s.restSeconds = parseInt(container.querySelector('#set-rest').value, 10) || s.restSeconds;
    s.timerAlertMode = container.querySelector('#set-alert').value;
    await saveSettings();
    toast('✅', 'Saved', 'Timer settings updated.');
  });
  container.querySelector('#export-btn').addEventListener('click', async () => {
    const dump = await DB.exportAll();
    const serializable = { ...dump, photos: [] };
    for (const p of dump.photos) { const b64 = await blobToBase64(p.blob); serializable.photos.push({ exerciseId: p.exerciseId, savedAt: p.savedAt, dataUrl: b64 }); }
    const json = JSON.stringify(serializable);
    const downloads = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null;
    if (!downloads) { toast('⚠️', 'Unavailable', 'File saving is not available in this view.'); return; }
    try {
      await downloads.save({ filename: `ironlog-backup-${todayISO()}.json`, data: json });
      toast('✅', 'Saved', 'Backup file saved.');
    } catch (err) {
      if (err && err.code === 'declined') return;
      toast('⚠️', 'Save failed', (err && err.message) || 'Could not save the backup file.');
    }
  });
  container.querySelector('#import-file').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (!confirm('This will replace all current data with the backup file. Continue?')) return;
    const dump = JSON.parse(await file.text());
    for (const p of dump.photos || []) { if (p.dataUrl) p.blob = await dataUrlToBlob(p.dataUrl); }
    await DB.importAll(dump);
    toast('✅', 'Imported', 'Backup restored. Reloading...');
    setTimeout(() => location.reload(), 1000);
  });
  container.querySelector('#reset-btn').addEventListener('click', async () => {
    if (!confirm('This permanently deletes ALL workouts, photos, and settings. Are you sure?')) return;
    if (!confirm('Really sure? This cannot be undone.')) return;
    indexedDB.deleteDatabase('ironlog');
    location.reload();
  });
}

function blobToBase64(blob) { return new Promise((resolve) => { const reader = new FileReader(); reader.onloadend = () => resolve(reader.result); reader.readAsDataURL(blob); }); }
async function dataUrlToBlob(dataUrl) { const res = await fetch(dataUrl); return res.blob(); }

boot();
</script>
